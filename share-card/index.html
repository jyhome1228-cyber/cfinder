<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
@font-face{font-family:Pretendard;src:url("../assets/fonts/PretendardVariable.woff2") format("woff2");font-display:block}
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}
body{font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;background:#fff;color:#132948}
.card{width:1200px;height:630px;background:#fff;display:grid;grid-template-columns:720px 480px;position:relative}
.left{padding:61px 0 57px 72px;position:relative;display:flex;flex-direction:column;align-items:flex-start}
.brand{width:231px;height:67px;object-fit:contain;object-position:left top;margin:0}
.eyebrow{margin:43px 0 15px;color:#2457e5;font-size:19px;font-weight:760;letter-spacing:.015em}
h1{margin:0;color:#172642;font-size:67px;line-height:1.22;font-weight:780;letter-spacing:-.064em}
h1 em{font-style:normal;color:#2457ee}
.sub{margin:23px 0 0;font-size:26px;color:#374d6c;font-weight:660;letter-spacing:-.03em}
.notes{margin-top:auto;display:flex;align-items:center;gap:12px;font-size:17px;color:#657790}
.notes span{display:block;width:7px;height:7px;border-radius:100%;background:#2457ee}
.right{position:relative;overflow:hidden;background:linear-gradient(150deg,#f1f6ff 0%,#e5efff 100%);height:630px}
.right:before{content:"";position:absolute;border:1px solid #c8dafa;width:570px;height:570px;border-radius:50%;left:60px;top:45px}
.right:after{content:"";position:absolute;border:1px solid #c8dafa;width:420px;height:420px;border-radius:50%;left:135px;top:120px}
.symbol{position:absolute;z-index:4;width:275px;height:270px;left:106px;top:99px;object-fit:contain;filter:drop-shadow(0px 15px 16px rgba(46,93,193,.06))}
.note-card{position:absolute;z-index:5;bottom:84px;left:48px;width:391px;height:125px;background:#fff;border:1px solid #d9e6ff;border-radius:15px;box-shadow:0 15px 40px rgba(34,74,148,.08);padding:22px 25px}
.note-card strong{font-size:21px;color:#184bc3;font-weight:750}
.note-card p{font-size:16px;line-height:1.65;color:#546982;margin:9px 0 0}
.bottom{position:absolute;left:0;bottom:0;height:7px;width:1200px;background:#2457ee}
</style></head>
<body><main class="card" role="img" aria-label="C-Finder 흥미 적성 가치관 나를 알아가는 진로탐색">
<div class="left"><img class="brand" src="../assets/brand/cfinder-official-logo.svg" alt="C-Finder"/>
<p class="eyebrow">중·고등학생을 위한 진로탐색</p>
<h1>나를 알아가는<br/><em>첫 번째 질문.</em></h1>
<p class="sub">흥미 · 적성 · 가치관</p>
<div class="notes"><span></span>중·고등학생 49항목 자기탐색 체험</div></div>
<div class="right"><img class="symbol" src="../assets/brand/cfinder-official-mark.svg" alt=""/>
<div class="note-card"><strong>나는 무엇을 좋아할까?</strong><p>좋아하는 일, 잘할 수 있는 일,<br/>중요하게 생각하는 것을 찾아봐요.</p></div></div>
<div class="bottom"></div></main></body></html>
